apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolluck-frontend
  namespace: rolluck-staging
  labels:
    app: rolluck-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rolluck-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: rolluck-frontend
    spec:
      containers:
        - name: frontend
          image: registry.digitalocean.com/staging-rolluck/frontend:staging-4d427c99
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              protocol: TCP
