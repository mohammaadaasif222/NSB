apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-http-redirect
  namespace: rolluck-staging
spec:
  parentRefs:
    - name: rolluck-gateway
      sectionName: http
  hostnames:
    - staging.xyzlife.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
