apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-http-redirect
  namespace: rolluck-staging
spec:
  hostnames:
    - staging.xyzlife.top
  parentRefs:
    - name: rolluck-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
