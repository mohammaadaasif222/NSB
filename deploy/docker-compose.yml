# Staging / production stack for the VPS.
#   cd deploy && cp .env.example .env   (fill it in)
#   docker compose up -d --build
#   docker compose exec api node dist/db/seed.js     (first deploy only)
name: nsb

# Log files stop growing at 50 MB per service, so logs cannot fill the disk.
x-logging: &logging
  options:
    max-size: 10m
    max-file: "5"

# Memory limits suit the 8 GB KVM 2: one service cannot take the others down with it.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 3g
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: nsb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nsb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsb -d nsb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://nsb:${POSTGRES_PASSWORD}@postgres:5432/nsb
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /repo/apps/api/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SITE_URL: ${SITE_URL:-}
      ADMIN_URL: ${ADMIN_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-nsb}
    volumes:
      # Images uploaded with the "local" storage setting. Back this volume up with the database.
      - uploads:/repo/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000/api
      # Absolute URLs in robots.txt and sitemap.xml.
      SITE_URL: ${SITE_URL:-}
    volumes:
      # Resized images and cached API data, so a deploy does not start them from nothing.
      - webcache:/app/apps/web/.next/cache
    healthcheck:
      # robots.txt is static, so a slow API does not mark the site unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  webcache:
  caddy_data:
  caddy_config:
