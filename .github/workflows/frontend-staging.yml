name: Frontend Staging CI/CD

on:
  push:
    branches:
      - staging

permissions:
  contents: write

env:
  REGISTRY: registry.digitalocean.com
  DOCR_REPOSITORY: staging-rolluck/frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: |
          doctl registry login --expiry-seconds 1200

      - name: Set image tag
        id: image
        run: |
          TAG="staging-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${DOCR_REPOSITORY}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_PASSWORD_SECRET="${{ secrets.NEXT_PUBLIC_PASSWORD_SECRET }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_CLARITY_PROJECT_ID="${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_ANALYTICS_DEBUG="${{ secrets.NEXT_PUBLIC_ANALYTICS_DEBUG }}" \
            --build-arg NEXT_PUBLIC_SOKETI_APP_KEY="${{ secrets.NEXT_PUBLIC_SOKETI_APP_KEY }}" \
            --build-arg NEXT_PUBLIC_SOKETI_HOST="${{ secrets.NEXT_PUBLIC_SOKETI_HOST }}" \
            --build-arg NEXT_PUBLIC_SOKETI_PORT="${{ secrets.NEXT_PUBLIC_SOKETI_PORT }}" \
            --build-arg NEXT_PUBLIC_SOKETI_USE_TLS="${{ secrets.NEXT_PUBLIC_SOKETI_USE_TLS }}" \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_ID="${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_ID }}" \
            --build-arg NEXT_PUBLIC_INTERCOM_APP_ID="${{ secrets.NEXT_PUBLIC_INTERCOM_APP_ID }}" \
            -t "${{ steps.image.outputs.image }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}"

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s#image: .*#image: ${{ steps.image.outputs.image }}#" \
            k8s/deployment.yaml

      - name: Commit Kubernetes image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes."
            exit 0
          fi

          git commit -m "chore: update frontend image to ${{ steps.image.outputs.tag }}"
          git push origin staging