name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nsb
          POSTGRES_PASSWORD: nsb
          POSTGRES_DB: nsb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nsb -d nsb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nsb:nsb@localhost:5432/nsb
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      COOKIE_SECURE: "false"
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-only-password-1234
      SEED_ADMIN_NAME: CI Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed:demo
      - run: npm run test:e2e -w @nsb/api
